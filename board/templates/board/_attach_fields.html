<p class="file-row">
    Картинку, гифку, видео или музыку можно вставить прямой ссылкой
    (оканчивается на .png, .jpg, .gif, .webp, .mp4, .webm, .mp3, .ogg…) &mdash;
    она раскроется под сообщением.
</p>
{% if allow_uploads %}
<div class="file-row">
    <label>Приложить картинки (до 4): <input type="file" name="images" accept="image/*" multiple></label>
</div>
<div class="file-row">
    <label>Приложить аудио (до 2): <input type="file" name="audio" accept="audio/*" multiple></label>
</div>
{% endif %}
